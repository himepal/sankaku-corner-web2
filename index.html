                        <body>
                        <div class="app">
                          <div class="shell">
                              <header class="topbar">
                                    <div class="brand"><span>三角コーナーwebチャット</span><span class="livecount" id="liveCount"><i></i> 同接 1人</span></div>
                                          <div class="topactions">
                                                  <button class="secondary" id="profileBtn">プロフィール</button>
                                                          <button class="secondary" id="historyBtn">結果・履歴</button>
                                                                  <button id="createBtn" hidden>＋ お題を作成</button>
                                                                        </div>
                                                                            </header>
                                                                                <nav class="mainnav">
                                                                                      <button class="navtab active" data-view="chat">食べカス掲示板</button>
                                                                                            <button class="navtab" data-view="ogiri">大喜利</button>
                                                                                                </nav>
                                                                                                    <section id="chatView">
                                                                                                          <div class="hero">
                                                                                                                  <div>
                                                                                                                            <h1>食べカス掲示板</h1>
                                                                                                                                      <p class="sub">匿名チャット。アイコンと名前を設定して参加。IDは1時間ごとに更新されます。</p>
                                                                                                                                              </div>
                                                                                                                                                      <button class="secondary" id="roomInviteBtn">共有</button>
                                                                                                                                                            </div>
                                                                                                                                                                  <section class="card chatpanel">
                                                                                                                                                                          <div class="roomheading">
                                                                                                                                                                                    <div>
                                                                                                                                                                                                <h2>フリー掲示板</h2>
                                                                                                                                                                                                            <div class="count" id="roomMeta">読み込み中...</div>
                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                      <div id="messages" class="messages"></div>
                                                                                                                                                                                                                                              <div id="replyingTo" class="replyingto" hidden></div>
                                                                                                                                                                                                                                                      <form id="messageForm" class="messageform">
                                                                                                                                                                                                                                                                <input id="messageInput" maxlength="1000" placeholder="メッセージを入力" autocomplete="off" required>
                                                                                                                                                                                                                                                                          <button type="submit" id="sendBtn">送信</button>
                                                                                                                                                                                                                                                                                  </form>
                                                                                                                                                                                                                                                                                        </section>
                                                                                                                                                                                                                                                                                            </section>
                                                                                                                                                                                                                                                                                                <section id="ogiriView" hidden>
                                                                                                                                                                                                                                                                                                      <div class="hero"><div><h1>大喜利</h1></div></div>
                                                                                                                                                                                                                                                                                                            <div class="toolbar">
                                                                                                                                                                                                                                                                                                                    <div class="filters" id="filters">
                                                                                                                                                                                                                                                                                                                              <button class="filter active" data-filter="active">進行中</button>
                                                                                                                                                                                                                                                                                                                                        <button class="filter" data-filter="answer">回答受付</button>
                                                                                                                                                                                                                                                                                                                                                  <button class="filter" data-filter="vote">投票中</button>
                                                                                                                                                                                                                                                                                                                                                            <button class="filter" data-filter="done">終了済み</button>
                                                                                                                                                                                                                                                                                                                                                                      <button class="filter" data-filter="all">すべて</button>
                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                      <div class="count" id="count"></div>
                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                  <main class="grid" id="grid"></main>
                                                                                                                                                                                                                                                                                                                                                                                                      </section>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                        <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                                                                                                                                                                                                                                                                                                                                                                                                          <div class="modal" id="modal"></div>
                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                          <div class="toast" id="toast" role="status"></div>

                                                                                                                                                                                                                                                                                                                                                                                                          <script>
                                                                                                                                                                                                                                                                                                                                                                                                          window.addEventListener('load', async () => {
                                                                                                                                                                                                                                                                                                                                                                                                            // Config & Constants
                                                                                                                                                                                                                                                                                                                                                                                                              const MAX_MESSAGES = 100; // チャット保存上限100件
                                                                                                                                                                                                                                                                                                                                                                                                                const ICON_OPTIONS = ['🐻','🐱','🐰','🦊','🐶','🐼','🐨','🐯','🦁','🐸','🐵','🐷','🐧','🐦','🦄','🤖','👻','🎃','🌟','🔥','💧','🌈','🎨','🎮','🎵','📚','🍜','🍙'];
                                                                                                                                                                                                                                                                                                                                                                                                                  const presets = [['5分',5],['10分',10],['30分',30],['1時間',60],['3時間',180]];

                                                                                                                                                                                                                                                                                                                                                                                                                    // App State
                                                                                                                                                                                                                                                                                                                                                                                                                      let currentView = 'chat';
                                                                                                                                                                                                                                                                                                                                                                                                                        let filter = 'active';
                                                                                                                                                                                                                                                                                                                                                                                                                          let toastTimer = null;
                                                                                                                                                                                                                                                                                                                                                                                                                            let selectedVote = null;
                                                                                                                                                                                                                                                                                                                                                                                                                              let replyTargetId = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                let chatMessages = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                  let ogiriTopics = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                    let isDbReady = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                      // DOM Helper
                                                                                                                                                                                                                                                                                                                                                                                                                                        const $ = id => document.getElementById(id);
                                                                                                                                                                                                                                                                                                                                                                                                                                          const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                                                                                                                                                                                                                                                                                                                                                                                                                                            const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);

                                                                                                                                                                                                                                                                                                                                                                                                                                              // Database setup. Firebase is used when a real config is supplied (hosted environment).
                                                                                                                                                                                                                                                                                                                                                                                                                                                // A plain HTML upload without Firebase config falls back to localStorage so Ogiri is usable immediately.
                                                                                                                                                                                                                                                                                                                                                                                                                                                  const appId = typeof __app_id !== 'undefined' ? __app_id : 'sankaku-corner-web';
                                                                                                                                                                                                                                                                                                                                                                                                                                                    let firebaseConfig = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                const parsed = JSON.parse(__firebase_config);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (parsed && parsed.apiKey && parsed.projectId && parsed.apiKey !== 'dummy' && parsed.projectId !== 'dummy') firebaseConfig = parsed;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (e) { console.warn('Firebase config is invalid; using local storage.', e); }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    getFirestore, doc, collection, setDoc, addDoc, deleteDoc, onSnapshot, getDocs, updateDoc;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let app, auth, db, user = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const localMode = !firebaseConfig;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!localMode && window.FirebaseDB) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ({ initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     getFirestore, doc, collection, setDoc, addDoc, deleteDoc, onSnapshot, getDocs, updateDoc } = window.FirebaseDB);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         app = initializeApp(firebaseConfig);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             auth = getAuth(app);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 db = getFirestore(app);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const cred = (typeof __initial_auth_token !== 'undefined' && __initial_auth_token)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   ? await signInWithCustomToken(auth, __initial_auth_token)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           : await signInAnonymously(auth);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 user = cred.user;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           console.warn('Firebase authentication failed; switching to local storage.', err);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   // Small Firestore-compatible local adapter for standalone HTML deployments.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (localMode || !db) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const prefix = 'sankaku_corner_db_v1:';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const listeners = new Map();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const readCollection = path => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       try { return JSON.parse(localStorage.getItem(prefix + path) || '{}'); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             catch (e) { return {}; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     const emit = path => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const data = readCollection(path);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 (listeners.get(path) || []).forEach(cb => cb({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         forEach: fn => Object.entries(data).forEach(([id, value]) => fn({ id, data: () => value }))
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const pathOf = parts => parts.filter(Boolean).join('/');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           initializeApp = cfg => ({ cfg });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               getAuth = () => ({});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   signInAnonymously = async () => ({ user: { uid: 'local-' + getLocalUid() } });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       signInWithCustomToken = signInAnonymously;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           onAuthStateChanged = () => () => {};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               getFirestore = () => ({});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   collection = (_db, ...parts) => ({ path: pathOf(parts), isCollection: true });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       doc = (first, ...parts) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             if (first && first.isCollection) return { path: first.path, id: parts[0] || uid(), isDoc: true };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   const id = parts.pop();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         return { path: pathOf(parts), id, isDoc: true };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 setDoc = async (ref, value) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const data = readCollection(ref.path); data[ref.id] = value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             localStorage.setItem(prefix + ref.path, JSON.stringify(data)); emit(ref.path);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     addDoc = async (ref, value) => { const id = uid(); await setDoc({ path: ref.path, id }, value); return { id }; };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         updateDoc = async (ref, patch) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               const data = readCollection(ref.path);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (!data[ref.id]) throw new Error('Document does not exist');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           data[ref.id] = { ...data[ref.id], ...patch };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 localStorage.setItem(prefix + ref.path, JSON.stringify(data)); emit(ref.path);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         deleteDoc = async ref => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               const data = readCollection(ref.path); delete data[ref.id];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     localStorage.setItem(prefix + ref.path, JSON.stringify(data)); emit(ref.path);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             getDocs = async ref => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   const data = readCollection(ref.path);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         return { forEach: fn => Object.entries(data).forEach(([id, value]) => fn({ id, data: () => value })) };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 onSnapshot = (ref, callback, errorCallback) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (!listeners.has(ref.path)) listeners.set(ref.path, []);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             listeners.get(ref.path).push(callback);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   try { emit(ref.path); } catch (e) { if (errorCallback) errorCallback(e); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         return () => listeners.set(ref.path, (listeners.get(ref.path) || []).filter(cb => cb !== callback));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 window.addEventListener('storage', e => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (e.key && e.key.startsWith(prefix)) emit(e.key.slice(prefix.length));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               function getLocalUid() {
