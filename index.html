<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三角コーナーweb</title>
<style>
:root {
  --bg: #f8f9fa; --panel: #ffffff; --sub: #f1f3f5; --text: #1a1d20;
    --muted: #6c757d; --border: #e9ecef; --primary: #6366f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
          --bg: #0f1115; --panel: #181b20; --sub: #22262f; --text: #f0f2f5;
              --muted: #8b95a1; --border: #2d323e; --primary: #818cf8;
                }
                }
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.5; }
                button, input, textarea { font: inherit; color: inherit; }
                button {
                  cursor: pointer; border: none; background: var(--primary); color: #fff;
                    font-weight: 600; padding: 8px 14px; border-radius: 8px;
                    }
                    button.sec { background: var(--sub); color: var(--text); border: 1px solid var(--border); }
                    .app { max-width: 900px; margin: 0 auto; padding: 16px; }
                    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
                    .nav { display: flex; gap: 8px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
                    .tab { background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 0; border-bottom: 3px solid transparent; }
                    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
                    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 400px; display: flex; flex-direction: column; }
                    .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 12px 0; max-height: 50vh; }
                    .msg { background: var(--sub); padding: 8px 12px; border-radius: 8px; max-width: 80%; }
                    .msg.me { align-self: flex-end; background: var(--primary); color: #fff; }
                    .form { display: flex; gap: 8px; }
                    .form input { flex: 1; background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; }
                    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
                    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
                    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 99; }
                    .modal-bg.show { display: flex; }
                    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: min(400px, 90%); padding: 16px; }
                    .field { margin-bottom: 12px; }
                    .field input, .field textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 6px; margin-top: 4px; }
                    </style>
                    </head>
                    <body>

                    <div class="app">
                      <header class="header">
                          <div style="font-weight:800; font-size:18px;">三角コーナーwebチャット</div>
                              <div style="display:flex; gap:6px;">
                                    <button type="button" class="sec" id="btnProfile">プロフィール</button>
                                          <button type="button" id="btnCreate" style="display:none;">＋ お題作成</button>
                                              </div>
                                                </header>

                                                  <nav class="nav">
                                                      <button type="button" class="tab active" id="tabChat">食べカス掲示板</button>
                                                          <button type="button" class="tab" id="tabOgiri">大喜利</button>
                                                            </nav>

                                                              <!-- 掲示板 -->
                                                                <section id="secChat">
                                                                    <div style="margin-bottom:12px;">
                                                                          <h1>食べカス掲示板</h1>
                                                                                <p style="color:var(--muted); font-size:13px;">匿名チャット。IDは1時間ごとに自動更新されます。</p>
                                                                                    </div>
                                                                                        <div class="panel">
                                                                                              <div id="msgList" class="msgs"></div>
                                                                                                    <form id="chatForm" class="form">
                                                                                                            <input id="chatIn" maxlength="1000" placeholder="メッセージを入力" required autocomplete="off">
                                                                                                                    <button type="submit">送信</button>
                                                                                                                          </form>
                                                                                                                              </div>
                                                                                                                                </section>

                                                                                                                                  <!-- 大喜利 -->
                                                                                                                                    <section id="secOgiri" style="display:none;">
                                                                                                                                        <div style="margin-bottom:12px;">
                                                                                                                                              <h1>大喜利</h1>
                                                                                                                                                  </div>
                                                                                                                                                      <div class="grid" id="ogiriGrid"></div>
                                                                                                                                                        </section>
                                                                                                                                                        </div>

                                                                                                                                                        <!-- モーダル -->
                                                                                                                                                        <div class="modal-bg" id="modalBg">
                                                                                                                                                          <div class="modal" id="modalBody"></div>
                                                                                                                                                          </div>

                                                                                                                                                          <script>
                                                                                                                                                          (() => {
                                                                                                                                                            'use strict';
                                                                                                                                                              const $ = id => document.getElementById(id);
                                                                                                                                                                const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                                                                                                                                                                  
                                                                                                                                                                    let user = JSON.parse(localStorage.getItem('u_data') || '{}');
                                                                                                                                                                      if (!user.uid) user.uid = Math.random().toString(36).slice(2);
                                                                                                                                                                        if (!user.nick) user.nick = '匿名';

                                                                                                                                                                          let chat = JSON.parse(localStorage.getItem('c_data') || '[]');
                                                                                                                                                                            let ogiri = JSON.parse(localStorage.getItem('o_data') || '[]');

                                                                                                                                                                              // --- タブ切り替え ---
                                                                                                                                                                                $('tabChat').onclick = () => switchTab(true);$('tabOgiri').onclick = () => switchTab(false);

                                                                                                                                                                                  function switchTab(isChat) {
                                                                                                                                                                                      $('secChat').style.display = isChat ? 'block' : 'none';
                                                                                                                                                                                          $('secOgiri').style.display = isChat ? 'none' : 'block';
                                                                                                                                                                                              $('tabChat').classList.toggle('active', isChat);
                                                                                                                                                                                                  $('tabOgiri').classList.toggle('active', !isChat);$('btnCreate').style.display = isChat ? 'none' : 'inline-block';
                                                                                                                                                                                                      if (isChat) renderChat(); else renderOgiri();
                                                                                                                                                                                                        }

                                                                                                                                                                                                          // --- チャット機能 ---
                                                                                                                                                                                                            function renderChat() {
                                                                                                                                                                                                                $('msgList').innerHTML = chat.map(m => `
                                                                                                                                                                                                                      <div class="msg ${m.uid === user.uid ? 'me' : ''}">
                                                                                                                                                                                                                              <div style="font-size:11px; opacity:0.7;">${esc(m.nick)}</div>
                                                                                                                                                                                                                                      <div>${esc(m.txt)}</div>
                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                `).join('');
                                                                                                                                                                                                                                                    $('msgList').scrollTop =$('msgList').scrollHeight;
                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                        $('chatForm').onsubmit = e => {
                                                                                                                                                                                                                                                            e.preventDefault();
                                                                                                                                                                                                                                                                const txt = $('chatIn').value.trim();
                                                                                                                                                                                                                                                                    if (!txt) return;
                                                                                                                                                                                                                                                                        chat.push({ uid: user.uid, nick: user.nick, txt });
                                                                                                                                                                                                                                                                            if (chat.length > 100) chat.shift(); // 上限100件
                                                                                                                                                                                                                                                                                localStorage.setItem('c_data', JSON.stringify(chat));
                                                                                                                                                                                                                                                                                    renderChat();
                                                                                                                                                                                                                                                                                        $('chatIn').value = '';
                                                                                                                                                                                                                                                                                          };

                                                                                                                                                                                                                                                                                            // --- 大喜利機能 ---
                                                                                                                                                                                                                                                                                              function renderOgiri() {
                                                                                                                                                                                                                                                                                                  if (!ogiri.length) {
                                                                                                                                                                                                                                                                                                        $('ogiriGrid').innerHTML = '<div style="color:var(--muted)">お題がありません</div>';
                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                      $('ogiriGrid').innerHTML = ogiri.map((t, idx) => `
                                                                                                                                                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                                                                                                                                                    <div style="font-weight:bold; margin-bottom:8px;">${esc(t.title)}</div>
                                                                                                                                                                                                                                                                                                                                            <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">回答 ${(t.ans||[]).length}件</div>
                                                                                                                                                                                                                                                                                                                                                    <button type="button" onclick="window.appAns(${idx})">回答する</button>
                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                              `).join('');
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                  $('btnCreate').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                      showModal(`
                                                                                                                                                                                                                                                                                                                                                                            <h3>お題を作成</h3>
                                                                                                                                                                                                                                                                                                                                                                                  <form id="fCreate">
                                                                                                                                                                                                                                                                                                                                                                                          <div class="field"><textarea id="tTitle" placeholder="お題を入力" required></textarea></div>
                                                                                                                                                                                                                                                                                                                                                                                                  <div style="text-align:right;">
                                                                                                                                                                                                                                                                                                                                                                                                            <button type="button" class="sec" onclick="window.closeM()">キャンセル</button>
                                                                                                                                                                                                                                                                                                                                                                                                                      <button type="submit">作成</button>
                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                        `);
                                                                                                                                                                                                                                                                                                                                                                                                                                            $('fCreate').onsubmit = e => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                        const title = $('tTitle').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!title) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ogiri.unshift({ title, ans: [] });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          localStorage.setItem('o_data', JSON.stringify(ogiri));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                closeM();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      renderOgiri();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              window.appAns = idx => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const t = ogiri[idx];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      showModal(`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h3>回答する</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p style="margin-bottom:8px;">${esc(t.title)}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <form id="fAns">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="field"><textarea id="aTxt" placeholder="回答を入力" required></textarea></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div style="text-align:right;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button type="button" class="sec" onclick="window.closeM()">キャンセル</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="submit">送信</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  $('fAns').onsubmit = e => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const txt = $('aTxt').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!txt) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!t.ans) t.ans = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                t.ans.push({ nick: user.nick, txt });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      localStorage.setItem('o_data', JSON.stringify(ogiri));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            closeM();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  renderOgiri();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // --- プロフィール ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            $('btnProfile').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showModal(`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h3>プロフィール</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <form id="fProf">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="field"><input id="pNick" value="${esc(user.nick)}" required></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div style="text-align:right;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button type="button" class="sec" onclick="window.closeM()">キャンセル</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit">保存</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      $('fProf').onsubmit = e => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  user.nick = $('pNick').value.trim() || '匿名';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        localStorage.setItem('u_data', JSON.stringify(user));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              closeM();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    renderChat();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function showModal(html) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                $('modalBody').innerHTML = html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('modalBg').classList.add('show');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.closeM = () => $('modalBg').classList.remove('show');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // 初期化
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            switchTab(true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            })();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
