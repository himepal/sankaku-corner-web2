<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三角コーナーweb</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #f8f9fa; --panel: #ffffff; --sub: #f1f3f5; --text: #1a1d20;
    --muted: #6c757d; --border: #e9ecef; --primary: #6366f1; --danger: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
          --bg: #0f1115; --panel: #181b20; --sub: #22262f; --text: #f0f2f5;
              --muted: #8b95a1; --border: #2d323e; --primary: #818cf8;
                }
                }
                * { box-sizing: border-box; margin: 0; padding: 0; }
                body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.5; }
                button, input, textarea, select { font: inherit; color: inherit; }
                button {
                  cursor: pointer; border: none; background: var(--primary); color: #fff;
                    font-weight: 600; padding: 8px 14px; border-radius: 8px;
                    }
                    button.sec { background: var(--sub); color: var(--text); border: 1px solid var(--border); }
                    button.danger { background: var(--danger); color: #fff; }
                    .app { max-width: 900px; margin: 0 auto; padding: 16px; }
                    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
                    .nav { display: flex; gap: 8px; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
                    .tab { background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 0; border-bottom: 3px solid transparent; }
                    .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: bold; }
                    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 400px; display: flex; flex-direction: column; }
                    .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 12px 0; max-height: 50vh; }
                    .msg { background: var(--sub); padding: 8px 12px; border-radius: 8px; max-width: 80%; }
                    .msg.me { align-self: flex-end; background: var(--primary); color: #fff; }
                    .form { display: flex; gap: 8px; }
                    .form input { flex: 1; background: var(--bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; }
                    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
                    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; position: relative; }
                    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 99; }
                    .modal-bg.show { display: flex; }
                    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: min(420px, 90%); padding: 16px; }
                    .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
                    .field input, .field textarea, .field select { width: 100%; background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 6px; }
                    .ans-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: var(--sub); border-radius: 6px; margin-bottom: 6px; }
                    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
                    .btn-del { background: transparent; color: var(--muted); border: none; padding: 2px 6px; font-size: 12px; }
                    .btn-del:hover { color: var(--danger); }
                    .timer-badge { font-size: 12px; font-weight: bold; background: var(--sub); padding: 4px 8px; border-radius: 6px; display: inline-block; margin-bottom: 8px; }
                    </style>
                    </head>
                    <body>

                    <div class="app">
                      <header class="header">
                          <div style="font-weight:800; font-size:18px;">三角コーナーwebチャット</div>
                              <div style="display:flex; gap:6px;">
                                    <button type="button" class="sec" id="btnProfile">プロフィール</button>
                                          <button type="button" id="btnCreate" style="display:none;">＋ お題作成</button>
                                              </div>
                                                </header>

                                                  <nav class="nav">
                                                      <button type="button" class="tab active" id="tabChat">食べカス掲示板</button>
                                                          <button type="button" class="tab" id="tabOgiri">大喜利</button>
                                                            </nav>

                                                              <!-- 掲示板 -->
                                                                <section id="secChat">
                                                                    <div style="margin-bottom:12px;">
                                                                          <h1>食べカス掲示板</h1>
                                                                                <p style="color:var(--muted); font-size:13px;">リアルタイム掲示板。オンライン共有中。</p>
                                                                                    </div>
                                                                                        <div class="panel">
                                                                                              <div id="msgList" class="msgs"></div>
                                                                                                    <form id="chatForm" class="form">
                                                                                                            <input id="chatIn" maxlength="1000" placeholder="メッセージを入力" required autocomplete="off">
                                                                                                                    <button type="submit">送信</button>
                                                                                                                          </form>
                                                                                                                              </div>
                                                                                                                                </section>

                                                                                                                                  <!-- 大喜利 -->
                                                                                                                                    <section id="secOgiri" style="display:none;">
                                                                                                                                        <div style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
                                                                                                                                              <h1>大喜利</h1>
                                                                                                                                                    <button type="button" class="sec" id="btnPurgeOld" style="font-size:12px; padding:4px 8px;">🧹 古いお題を削除</button>
                                                                                                                                                        </div>
                                                                                                                                                            <div class="grid" id="ogiriGrid"></div>
                                                                                                                                                              </section>
                                                                                                                                                              </div>

                                                                                                                                                              <!-- モーダル -->
                                                                                                                                                              <div class="modal-bg" id="modalBg">
                                                                                                                                                                <div class="modal" id="modalBody"></div>
                                                                                                                                                                </div>

                                                                                                                                                                <script>
                                                                                                                                                                (() => {
                                                                                                                                                                  'use strict';
                                                                                                                                                                    const $ = id => document.getElementById(id);
                                                                                                                                                                      const esc = s => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                                                                                                                                                                        
                                                                                                                                                                          const firebaseConfig = {
                                                                                                                                                                              apiKey: "AIzaSyCVu-bjaiFLWwl37wRWwAcMGAR6a59HCc4",
                                                                                                                                                                                  authDomain: "kaku-corner.firebaseapp.com",
                                                                                                                                                                                      databaseURL: "https://kaku-corner-default-rtdb.firebaseio.com",
                                                                                                                                                                                          projectId: "kaku-corner",
                                                                                                                                                                                              storageBucket: "kaku-corner.firebasestorage.app",
                                                                                                                                                                                                  messagingSenderId: "186203447573",
                                                                                                                                                                                                      appId: "1:186203447573:web:41efbc0aad79551434891c",
                                                                                                                                                                                                          measurementId: "G-VX7ZWZC4LR"
                                                                                                                                                                                                            };

                                                                                                                                                                                                              let db = null, chatRef = null, ogiriRef = null;

                                                                                                                                                                                                                try {
                                                                                                                                                                                                                    firebase.initializeApp(firebaseConfig);
                                                                                                                                                                                                                        db = firebase.database();
                                                                                                                                                                                                                            chatRef = db.ref('chat_messages');
                                                                                                                                                                                                                                ogiriRef = db.ref('ogiri_topics');
                                                                                                                                                                                                                                  } catch(e) { console.error("Firebase error:", e); }

                                                                                                                                                                                                                                    let user = JSON.parse(localStorage.getItem('u_data') || '{}');
                                                                                                                                                                                                                                      if (!user.uid) user.uid = Math.random().toString(36).slice(2);
                                                                                                                                                                                                                                        if (!user.nick) user.nick = '匿名';

                                                                                                                                                                                                                                          let chatList = [];
                                                                                                                                                                                                                                            let rawOgiriList = [];
                                                                                                                                                                                                                                              const MAX_CHAT = 100;

                                                                                                                                                                                                                                                $('tabChat').onclick = () => switchTab(true);$('tabOgiri').onclick = () => switchTab(false);

                                                                                                                                                                                                                                                  function switchTab(isChat) {
                                                                                                                                                                                                                                                      $('secChat').style.display = isChat ? 'block' : 'none';
                                                                                                                                                                                                                                                          $('secOgiri').style.display = isChat ? 'none' : 'block';
                                                                                                                                                                                                                                                              $('tabChat').classList.toggle('active', isChat);
                                                                                                                                                                                                                                                                  $('tabOgiri').classList.toggle('active', !isChat);$('btnCreate').style.display = isChat ? 'none' : 'inline-block';
                                                                                                                                                                                                                                                                      if (isChat) renderChat(); else renderOgiri();
                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                          // --- チャット ---
                                                                                                                                                                                                                                                                            function renderChat() {
                                                                                                                                                                                                                                                                                $('msgList').innerHTML = chatList.map(m => `
                                                                                                                                                                                                                                                                                      <div class="msg ${m.uid === user.uid ? 'me' : ''}">
                                                                                                                                                                                                                                                                                              <div style="font-size:11px; opacity:0.7;">${esc(m.nick)}</div>
                                                                                                                                                                                                                                                                                                      <div>${esc(m.txt)}</div>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                `).join('');
                                                                                                                                                                                                                                                                                                                    $('msgList').scrollTop =$('msgList').scrollHeight;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                        $('chatForm').onsubmit = e => {
                                                                                                                                                                                                                                                                                                                            e.preventDefault();
                                                                                                                                                                                                                                                                                                                                const txt = $('chatIn').value.trim();
                                                                                                                                                                                                                                                                                                                                    if (!txt) return;

                                                                                                                                                                                                                                                                                                                                        const msg = { uid: user.uid, nick: user.nick, txt, at: Date.now() };
                                                                                                                                                                                                                                                                                                                                            if (chatRef) chatRef.push(msg);
                                                                                                                                                                                                                                                                                                                                                $('chatIn').value = '';
                                                                                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                                                                                    if (chatRef) {
                                                                                                                                                                                                                                                                                                                                                        chatRef.limitToLast(MAX_CHAT).on('value', snap => {
                                                                                                                                                                                                                                                                                                                                                              chatList = [];
                                                                                                                                                                                                                                                                                                                                                                    snap.forEach(child => { chatList.push(child.val()); });
                                                                                                                                                                                                                                                                                                                                                                          renderChat();
                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                  // --- 大喜利 ---
                                                                                                                                                                                                                                                                                                                                                                                    function renderOgiri() {
                                                                                                                                                                                                                                                                                                                                                                                        const validTopics = rawOgiriList.filter(t => t.ansTime && t.voteTime && t.delKey);

                                                                                                                                                                                                                                                                                                                                                                                            if (!validTopics.length) {
                                                                                                                                                                                                                                                                                                                                                                                                  $('ogiriGrid').innerHTML = '<div style="color:var(--muted)">有効なお題がありません。「＋ お題作成」から追加してください。</div>';
                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                const now = Date.now();

                                                                                                                                                                                                                                                                                                                                                                                                                    $('ogiriGrid').innerHTML = validTopics.map(t => {
                                                                                                                                                                                                                                                                                                                                                                                                                          const answers = t.answers ? Object.entries(t.answers).map(([aKey, val]) => ({ aKey, ...val })) : [];
                                                                                                                                                                                                                                                                                                                                                                                                                                const isOwner = t.ownerUid === user.uid; // 作成者判定
                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                            let status = 'answer';
                                                                                                                                                                                                                                                                                                                                                                                                                                                  let timerText = '';

                                                                                                                                                                                                                                                                                                                                                                                                                                                        const ansEndTime = t.createdAt + (t.ansTime * 60 * 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              const voteEndTime = ansEndTime + (t.voteTime * 60 * 1000);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (now < ansEndTime) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            status = 'answer';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const leftSec = Math.ceil((ansEndTime - now) / 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            timerText = `⏱️ 回答締切まで: ${Math.floor(leftSec/60)}分${leftSec%60}秒`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  } else if (now < voteEndTime) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          status = 'vote';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const leftSec = Math.ceil((voteEndTime - now) / 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          timerText = `🗳️ 投票締切まで: ${Math.floor(leftSec/60)}分${leftSec%60}秒`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        status = 'done';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                timerText = `🏆 終了（結果確定）`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let actionBtn = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (status === 'answer') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          actionBtn = `<button type="button" onclick="window.appAns('${t.key}')">回答する</button>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else if (status === 'vote') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        actionBtn = `<button type="button" onclick="window.appVote('${t.key}')">投票する</button>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      actionBtn = `<button type="button" class="sec" onclick="window.appResult('${t.key}')">結果を見る</button>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const statusText = status === 'answer' ? '【回答受付中】' : status === 'vote' ? '【投票中】' : '【終了】';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="card-head">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <span style="font-size:12px; color:var(--primary); font-weight:bold;">${statusText}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ${isOwner ? `<button type="button" class="btn-del" onclick="window.deleteTopic('${t.key}')" title="自分が作成したお題を削除">✕ 削除</button>` : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="timer-badge">${timerText}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div style="font-weight:bold; margin-bottom:8px;">${esc(t.title)}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div style="font-size:12px; color:var(--muted); margin-bottom:10px;">回答 ${answers.length}件</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div style="display:flex; gap:6px;">${actionBtn}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          setInterval(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if ($('secOgiri').style.display !== 'none') renderOgiri();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }, 1000);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (ogiriRef) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ogiriRef.on('value', snap => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            rawOgiriList = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  snap.forEach(child => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          rawOgiriList.unshift({ key: child.key, ...child.val() });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      renderOgiri();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              $('btnPurgeOld').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const oldTopics = rawOgiriList.filter(t => !t.ansTime || !t.voteTime || !t.delKey);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!oldTopics.length) return alert('古い形式のお題はありません');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (confirm(`旧仕様の古いお題 (${oldTopics.length}件) をすべてデータベースから削除しますか？`)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                oldTopics.forEach(t => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (ogiriRef) ogiriRef.child(t.key).remove();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert('削除を完了しました。');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // 本人のみ実行可能な削除処理
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              window.deleteTopic = key => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const t = rawOgiriList.find(x => x.key === key);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!t) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (t.ownerUid !== user.uid) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert('自分が作成したお題のみ削除できます。');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
