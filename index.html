<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三角コーナーweb</title>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f4f0,#151719);--panel:light-dark(#fff,#202326);--panel2:light-dark(#f0efe9,#292d30);--text:light-dark(#202322,#f1f2ee);--muted:light-dark(#70756f,#a5aca5);--line:light-dark(#dedfd7,#3a4042);--accent:light-dark(#6c4be8,#a995ff);--accentText:#fff;--green:light-dark(#16845d,#6bd5a8);--orange:light-dark(#b96b13,#ffc27a);--red:light-dark(#bf4343,#ff8b8b);--shadow:0 8px 28px #0000000b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;background:var(--accent);color:var(--accentText);font-weight:700;transition:transform .12s,opacity .12s}button:hover{opacity:.88}button:active{transform:scale(.98)}button:disabled{opacity:.38;cursor:not-allowed}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.danger{background:var(--red);color:#fff}.small{font-size:12px;padding:7px 10px}.livecount{display:inline-flex;align-items:center;gap:6px;margin-left:14px;font-size:12px;color:var(--muted);font-weight:500}.livecount i{width:7px;height:7px;background:#28b879;border-radius:50%;display:inline-block}.replyingto{padding:9px 12px;margin-top:10px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;font-size:13px;color:var(--muted)}.replyingto button{float:right;background:transparent;color:var(--muted);padding:0 4px}.replypreview{padding:5px 8px;margin-bottom:6px;border-left:2px solid var(--accent);background:var(--bg);border-radius:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messagefoot{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.replybtn,.likebtn{background:transparent;color:var(--muted);font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:6px}.likebtn.liked{color:var(--red);border-color:var(--red)}.icon{font-size:18px;margin-right:6px}.mainnav{display:flex;gap:8px;border-bottom:1px solid var(--line);padding:0 0 12px;margin-bottom:12px}.navtab{background:transparent;color:var(--muted);border:1px solid transparent}.navtab.active{background:var(--panel2);color:var(--text);border-color:var(--line)}.chatlayout{display:block}.chatpanel{min-height:500px;display:flex;flex-direction:column}.roomheading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}.roomheading h2{margin:0;font-size:21px}.messages{display:flex;flex-direction:column;gap:10px;padding:18px 0;flex:1;min-height:280px;max-height:55vh;overflow:auto}.message{max-width:85%;align-self:flex-start;padding:10px 13px;background:var(--panel2);border-radius:14px;overflow-wrap:anywhere}.message.mine{align-self:flex-end;background:color-mix(in srgb,var(--accent) 18%,var(--panel));border:1px solid var(--accent)}.messagehead{font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center}.messagebody{white-space:pre-wrap}.messageform{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}.messageform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px}.shell{max-width:1100px;margin:auto;padding:0 22px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:12px}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:850;letter-spacing:-.04em}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:white;font-size:22px}.topactions{display:flex;gap:8px;flex-wrap:wrap}.hero{padding:28px 0 24px;display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--accent)}h1{font-size:clamp(28px,5vw,42px);line-height:1.13;margin:8px 0 10px;letter-spacing:-.055em}.sub{color:var(--muted);max-width:560px;margin:0}.heroMark{font-size:68px;opacity:.9}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;flex-wrap:wrap}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 12px;font-size:13px}.filter.active{background:var(--panel2);color:var(--text);border-color:var(--accent)}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;background:var(--panel2);color:var(--muted)}.tag.open{color:var(--green)}.tag.vote{color:var(--accent)}.tag.done{color:var(--muted)}.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.id{font-size:12px;color:var(--muted);font-weight:700}.prompt{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin:18px 0;overflow-wrap:anywhere}.stats{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px}.stats span{display:flex;gap:5px;align-items:center}.timerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 14px;padding:12px;border-radius:12px;background:var(--panel2)}.timerlabel{font-size:11px;color:var(--muted)}.timer{font-size:20px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.timer.warn{color:var(--orange)}.cardactions{display:flex;gap:8px}.cardactions button{flex:1}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.empty b{display:block;color:var(--text);font-size:18px;margin:10px}.foot{padding:32px 0;text-align:center;color:var(--muted);font-size:12px}.overlay{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 80px #0005}.modal h2{font-size:23px;letter-spacing:-.04em;margin:0 0 7px}.modal p{color:var(--muted);margin:0 0 20px;font-size:14px}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field label{font-size:13px;font-weight:750}.field input,.field textarea,.field select{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;width:100%;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}.field textarea{min-height:100px;resize:vertical}.timings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.answers{display:flex;flex-direction:column;gap:9px}.answer{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);text-align:left;color:var(--text);font-weight:500;width:100%}.answer.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.answer .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:850}.answerbody{flex:1;overflow-wrap:anywhere}.answer small{display:block;color:var(--muted);margin-top:5px}.notice{padding:12px;border-radius:11px;background:var(--panel2);color:var(--muted);font-size:13px;margin:12px 0}.resultrow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.medal{font-size:22px;width:30px}.resulttext{flex:1;overflow-wrap:anywhere}.votes{font-weight:800;white-space:nowrap}.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--text);color:var(--bg);border-radius:12px;box-shadow:var(--shadow);display:none;max-width:90vw;font-size:14px}.toast.show{display:block}.adminhint{font-size:12px;color:var(--muted);margin-top:12px}.divider{height:1px;background:var(--line);margin:18px 0}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--panel2);color:var(--text);font-size:12px}.pill:hover{border-color:var(--accent)}.sectiontitle{font-size:15px;font-weight:850;margin:0 0 12px}.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:10px 0}.icon-opt{font-size:24px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;text-align:center}.icon-opt.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel))}@media(max-width:700px){.chatpanel{min-height:400px}.shell{padding:0 14px 40px}.topbar{padding:15px 0}.brand{font-size:17px}.logo{width:35px;height:35px}.hero{padding:25px 0 16px}.heroMark{font-size:48px}.grid{grid-template-columns:1fr}.card{padding:17px}.prompt{font-size:20px}.timings{grid-template-columns:1fr}.modal{padding:20px}.topactions button{padding:8px 10px;font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
      <header class="topbar">
            <div class="brand"><span>三角コーナーwebチャット</span><span class="livecount" id="liveCount"><i></i> 同接 1人</span></div>
                  <div class="topactions">
                          <button class="secondary" id="profileBtn">プロフィール</button>
                                  <button class="secondary" id="historyBtn">結果・履歴</button>
                                          <button id="createBtn">＋ お題を作成</button>
                                                </div>
                                                    </header>
                                                        <nav class="mainnav"><button class="navtab active" data-view="chat">食べカス掲示板</button><button class="navtab" data-view="ogiri">大喜利</button></nav>
                                                            <section id="chatView">
                                                                  <div class="hero"><div><h1>食べカス掲示板</h1><p class="sub">匿名チャット。アイコンと名前を設定して参加。IDは1時間ごとに更新されます。Gun.jsで共有保存（上限100件）。</p></div><button class="secondary" id="roomInviteBtn">共有</button></div>
                                                                        <section class="card chatpanel"><div class="roomheading"><div><h2>フリー掲示板</h2><div class="count" id="roomMeta">同期中...</div></div></div><div id="messages" class="messages"></div><div id="replyingTo" class="replyingto" hidden></div><form id="messageForm" class="messageform"><input id="messageInput" maxlength="1000" placeholder="メッセージを入力" autocomplete="off" required><button type="submit">送信</button></form></section>
                                                                            </section>
                                                                                <section id="ogiriView" hidden>
                                                                                      <div class="hero"><div><h1>大喜利</h1></div></div>
                                                                                            <div class="toolbar">
                                                                                                    <div class="filters" id="filters"><button class="filter active" data-filter="active">進行中</button><button class="filter" data-filter="answer">回答受付</button><button class="filter" data-filter="vote">投票中</button><button class="filter" data-filter="done">終了済み</button><button class="filter" data-filter="all">すべて</button></div>
                                                                                                            <div class="count" id="count"></div>
                                                                                                                  </div>
                                                                                                                        <main class="grid" id="grid"></main>
                                                                                                                            </section>
                                                                                                                              </div>
                                                                                                                              </div>
                                                                                                                              <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal" id="modal"></div></div>
                                                                                                                              <div class="toast" id="toast" role="status"></div>
                                                                                                                              <script>
                                                                                                                              (() => {
                                                                                                                              const STORE='oogiri_hiroba_v1';
                                                                                                                              const MAX_MESSAGES = 100;
                                                                                                                              const ICON_OPTIONS = ['🐻','🐱','🐰','🦊','🐶','🐼','🐨','🐯','🦁','🐸','🐵','🐷','🐧','🐦','🦄','🤖','👻','🎃','🌟','🔥','💧','🌈','🎨','🎮','🎵','📚','🍜','🍙'];
                                                                                                                              const presets=[['5分',5],['10分',10],['30分',30],['1時間',60],['3時間',180]];
                                                                                                                              let state={topics:[],votes:{},rooms:[],settings:{defaultAnswer:10,defaultVote:10}};
                                                                                                                              let currentView='chat', filter='active', toastTimer, selectedVote=null, replyTargetId=null;
                                                                                                                              let chatMessages = []; // {id, text, authorUid, displayId, name, icon, at, replyTo, likedBy, likeCount}
                                                                                                                              const $=id=>document.getElementById(id);
                                                                                                                              const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
                                                                                                                              const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);

                                                                                                                              // === Gun.js 共有チャット（設定不要） ===
                                                                                                                              const gun = Gun([
                                                                                                                                'https://gun-manhattan.herokuapp.com/gun',
                                                                                                                                  'https://gun-us.herokuapp.com/gun',
                                                                                                                                    'wss://relay.peer.ooo/gun'
                                                                                                                                    ]);
                                                                                                                                    const messagesRef = gun.get('sankaku-corner-chat-v1');

                                                                                                                                    // === ユーザープロフィール（アイコン・名前・匿名ID） ===
                                                                                                                                    function getProfile() {
                                                                                                                                      let p = JSON.parse(localStorage.getItem('user_profile') || '{}');
                                                                                                                                        if (!p.persistentUid) p.persistentUid = uid();
                                                                                                                                          const now = Date.now();
                                                                                                                                            if (!p.displayId || !p.idTime || now - p.idTime > 3600000) {
                                                                                                                                                p.displayId = Math.random().toString(36).slice(2, 6).toUpperCase();
                                                                                                                                                    p.idTime = now;
                                                                                                                                                      }
                                                                                                                                                        if (!p.nick) p.nick = '匿名';
                                                                                                                                                          if (!p.icon) p.icon = ICON_OPTIONS[0];
                                                                                                                                                            localStorage.setItem('user_profile', JSON.stringify(p));
                                                                                                                                                              return p;
                                                                                                                                                              }
                                                                                                                                                              let profile = getProfile();

                                                                                                                                                              function openProfile() {
                                                                                                                                                                const p = getProfile();
                                                                                                                                                                  openModal(`<h2 id="modalTitle">プロフィール設定</h2><p>デュラララチャットのようにアイコンと名前を設定できます。匿名IDは1時間ごとに自動更新されます。</p>
                                                                                                                                                                    <form id="profileForm">
                                                                                                                                                                        <div class="field"><label>名前</label><input id="nickInput" maxlength="12" value="${esc(p.nick)}" placeholder="匿名"></div>
                                                                                                                                                                            <div class="field"><label>アイコン</label>
                                                                                                                                                                                  <div class="icon-grid" id="iconGrid">${ICON_OPTIONS.map(ic => `<button type="button" class="icon-opt \( {ic===p.icon?'selected':''}" data-icon=" \){ic}">${ic}</button>`).join('')}</div>
                                                                                                                                                                                        <input id="customIcon" maxlength="2" placeholder="または絵文字を直接入力" value="${p.icon.length<=2?esc(p.icon):''}">
                                                                                                                                                                                            </div>
                                                                                                                                                                                                <div class="notice">現在の匿名ID: #\( {p.displayId} （次回更新まで約 \){Math.max(0, Math.ceil((3600000 - (Date.now()-p.idTime))/60000))}分）</div>
                                                                                                                                                                                                    <div class="modalactions"><button type="button" class="secondary" onclick="window.og.close()">キャンセル</button><button type="submit">保存</button></div>
                                                                                                                                                                                                      </form>`);
                                                                                                                                                                                                        document.querySelectorAll('.icon-opt').forEach(b => b.onclick = () => {
                                                                                                                                                                                                            document.querySelectorAll('.icon-opt').forEach(x => x.classList.remove('selected'));
                                                                                                                                                                                                                b.classList.add('selected');
                                                                                                                                                                                                                    $('customIcon').value = b.dataset.icon;
                                                                                                                                                                                                                      });
                                                                                                                                                                                                                        $('profileForm').onsubmit = e => {
                                                                                                                                                                                                                            e.preventDefault();
                                                                                                                                                                                                                                const nick = $('nickInput').value.trim() || '匿名';
                                                                                                                                                                                                                                    const icon = $('customIcon').value.trim() || document.querySelector('.icon-opt.selected')?.dataset.icon || ICON_OPTIONS[0];
                                                                                                                                                                                                                                        profile.nick = nick.slice(0,12);
                                                                                                                                                                                                                                            profile.icon = icon.slice(0,2);
                                                                                                                                                                                                                                                localStorage.setItem('user_profile', JSON.stringify(profile));
                                                                                                                                                                                                                                                    closeModal();
                                                                                                                                                                                                                                                        toast('プロフィールを更新しました');
                                                                                                                                                                                                                                                            if (currentView === 'chat') renderRooms();
                                                                                                                                                                                                                                                              };
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                              // === チャット表示・保存 ===
                                                                                                                                                                                                                                                              function pruneAndRender() {
                                                                                                                                                                                                                                                                chatMessages.sort((a,b) => a.at - b.at);
                                                                                                                                                                                                                                                                  if (chatMessages.length > MAX_MESSAGES) {
                                                                                                                                                                                                                                                                      const toRemove = chatMessages.slice(0, chatMessages.length - MAX_MESSAGES);
                                                                                                                                                                                                                                                                          toRemove.forEach(m => {
                                                                                                                                                                                                                                                                                if (m.gunKey) messagesRef.get(m.gunKey).put(null);
                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                        chatMessages = chatMessages.slice(-MAX_MESSAGES);
                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                            renderRooms();
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                            function renderRooms() {
                                                                                                                                                                                                                                                                                              profile = getProfile();
                                                                                                                                                                                                                                                                                                \( ('roomMeta').textContent = ` \){chatMessages.length}件のメッセージ（共有・上限${MAX_MESSAGES}）`;
                                                                                                                                                                                                                                                                                                  $('messages').innerHTML = chatMessages.map(m => {
                                                                                                                                                                                                                                                                                                      const parent = m.replyTo ? chatMessages.find(x => x.id === m.replyTo) : null;
                                                                                                                                                                                                                                                                                                          const isMine = m.authorUid === profile.persistentUid;
                                                                                                                                                                                                                                                                                                              const liked = (m.likedBy || []).includes(profile.persistentUid);
                                                                                                                                                                                                                                                                                                                  const likeCount = m.likeCount || (m.likedBy || []).length || 0;
                                                                                                                                                                                                                                                                                                                      return `<div class="message \( {isMine?'mine':''}" data-message=" \){m.id}">
                                                                                                                                                                                                                                                                                                                            ${parent ? `<div class="replypreview">↳ ${esc(parent.name||'匿名')}: ${esc(parent.text)}</div>` : ''}
                                                                                                                                                                                                                                                                                                                                  <div class="messagehead"><span class="icon">\( {esc(m.icon||'👤')}</span> \){esc(m.name||'匿名')} <span style="opacity:.6">#${esc(m.displayId||'')}</span> · ${new Date(m.at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div>
                                                                                                                                                                                                                                                                                                                                        <div class="messagebody">${esc(m.text)}</div>
                                                                                                                                                                                                                                                                                                                                              <div class="messagefoot">
                                                                                                                                                                                                                                                                                                                                                      <button class="likebtn \( {liked?'liked':''}" data-like=" \){m.id}">❤️ ${likeCount}</button>
                                                                                                                                                                                                                                                                                                                                                              <button class="replybtn" data-reply="${m.id}">返信</button>
                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                        </div>`;
                                                                                                                                                                                                                                                                                                                                                                          }).join('');
                                                                                                                                                                                                                                                                                                                                                                            $('messages').scrollTop = $('messages').scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                              // 同接カウント（直近5分の投稿者 + 自分）
                                                                                                                                                                                                                                                                                                                                                                                const recent = new Set(chatMessages.filter(m => Date.now() - m.at < 5*60*1000).map(m => m.authorUid));
                                                                                                                                                                                                                                                                                                                                                                                  recent.add(profile.persistentUid);
                                                                                                                                                                                                                                                                                                                                                                                    $('liveCount').innerHTML = `<i></i> 同接 ${recent.size}人`;
                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                    function sendMessage(text) {
                                                                                                                                                                                                                                                                                                                                                                                      profile = getProfile();
                                                                                                                                                                                                                                                                                                                                                                                        const msg = {
                                                                                                                                                                                                                                                                                                                                                                                            id: uid(),
                                                                                                                                                                                                                                                                                                                                                                                                text,
                                                                                                                                                                                                                                                                                                                                                                                                    authorUid: profile.persistentUid,
                                                                                                                                                                                                                                                                                                                                                                                                        displayId: profile.displayId,
                                                                                                                                                                                                                                                                                                                                                                                                            name: profile.nick,
                                                                                                                                                                                                                                                                                                                                                                                                                icon: profile.icon,
                                                                                                                                                                                                                                                                                                                                                                                                                    at: Date.now(),
                                                                                                                                                                                                                                                                                                                                                                                                                        replyTo: replyTargetId,
                                                                                                                                                                                                                                                                                                                                                                                                                            likedBy: [],
                                                                                                                                                                                                                                                                                                                                                                                                                                likeCount: 0
                                                                                                                                                                                                                                                                                                                                                                                                                                  };
                                                                                                                                                                                                                                                                                                                                                                                                                                    const key = messagesRef.get(msg.id).put(msg);
                                                                                                                                                                                                                                                                                                                                                                                                                                      // key is not directly returned easily, but we track by id
                                                                                                                                                                                                                                                                                                                                                                                                                                        $('messageInput').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                          clearReply();
                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                          function toggleLike(msgId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                            profile = getProfile();
                                                                                                                                                                                                                                                                                                                                                                                                                                              const m = chatMessages.find(x => x.id === msgId);
                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!m) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  const likedBy = m.likedBy || [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                    const idx = likedBy.indexOf(profile.persistentUid);
                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (idx >= 0) likedBy.splice(idx, 1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                        else likedBy.push(profile.persistentUid);
                                                                                                                                                                                                                                                                                                                                                                                                                                                          m.likedBy = likedBy;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            m.likeCount = likedBy.length;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              messagesRef.get(msgId).put(m);
                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              // Gunリスナー
                                                                                                                                                                                                                                                                                                                                                                                                                                                              const msgMap = new Map();
                                                                                                                                                                                                                                                                                                                                                                                                                                                              messagesRef.map().on((data, key) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!data || !data.id || data === null) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (key && msgMap.has(key)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          msgMap.delete(key);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                chatMessages = Array.from(msgMap.values());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      pruneAndRender();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  data.gunKey = key;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    msgMap.set(key, data);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      chatMessages = Array.from(msgMap.values());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        pruneAndRender();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // === イベント ===
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function setReply(id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const m = chatMessages.find(x => x.id === id);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('cancelReply').onclick = clearReply;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      $('messageInput').focus();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function clearReply() { replyTargetId = null; $('replyingTo').hidden = true; $('replyingTo').textContent = ''; }
