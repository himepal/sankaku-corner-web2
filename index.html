<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>三角コーナーwebチャット＆大喜利</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f4f0, #151719);
      --panel: light-dark(#fff, #202326);
      --panel2: light-dark(#f0efe9, #292d30);
      --text: light-dark(#202322, #f1f2ee);
      --muted: light-dark(#70756f, #a5aca5);
      --line: light-dark(#dedfd7, #3a4042);
      --accent: light-dark(#6c4be8, #a995ff);
      --green: light-dark(#16845d, #6bd5a8);
      --orange: light-dark(#b96b13, #ffc27a);
      --red: light-dark(#bf4343, #ff8b8b);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.5; }
    button, input, textarea, select { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      color: #fff;
      background: var(--accent);
      font-weight: 700;
    }
    button:hover { opacity: .88; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button.secondary { color: var(--text); background: var(--panel2); border: 1px solid var(--line); }
    button.danger { background: var(--red); }
    button.small { padding: 5px 9px; font-size: 12px; }
    button.active { border-color: var(--accent); color: var(--text); }
    input, textarea {
      width: 100%;
      padding: 11px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .shell { width: min(1050px, 100%); margin: auto; padding: 16px 20px 48px; }
    .topbar, .hero, .roomheading, .toolbar, .cardhead, .cardactions, .messagefoot, .modalactions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .topbar { flex-wrap: wrap; padding: 10px 0 18px; }
    .brand { font-size: 19px; font-weight: 850; letter-spacing: -.04em; }
    .topactions, .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .status { color: var(--muted); font-size: 12px; }
    .mainnav { display: flex; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .navtab, .filter { color: var(--muted); background: transparent; border: 1px solid transparent; }
    .navtab.active, .filter.active { color: var(--text); background: var(--panel2); border-color: var(--line); }
    .hero { padding: 20px 0 14px; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 38px); letter-spacing: -.05em; }
    h2 { margin: 0; font-size: 20px; }
    .sub, .muted { color: var(--muted); }
    .sub { margin: 5px 0 0; }
    .card, .chatpanel {
      min-width: 0;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .chatpanel { min-height: 65vh; display: flex; flex-direction: column; }
    .roomheading { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .messages { display: flex; flex: 1; flex-direction: column; gap: 9px; min-height: 260px; max-height: 55vh; overflow: auto; padding: 14px 0; }
    .message { align-self: flex-start; max-width: 88%; overflow-wrap: anywhere; padding: 9px 12px; background: var(--panel2); border-radius: 13px; }
    .message.mine { align-self: flex-end; border: 1px solid var(--accent); }
    .messagehead, .messagefoot { color: var(--muted); font-size: 12px; }
    .messagehead { margin-bottom: 4px; }
    .messagebody { white-space: pre-wrap; }
    .messageform { display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
    .messageform input { flex: 1; min-width: 0; }
    .replyingto, .notice { margin: 10px 0; padding: 10px; color: var(--muted); background: var(--panel2); border-radius: 9px; }
    .replypreview { margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .likebtn, .replybtn { padding: 2px 7px; color: var(--muted); background: transparent; border: 1px solid var(--line); font-size: 12px; }
    .likebtn.liked { color: var(--red); }
    .toolbar { flex-wrap: wrap; margin: 16px 0; }
    .filter { padding: 6px 10px; font-size: 13px; }
    .count { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .prompt { margin: 14px 0; font-size: 20px; font-weight: 800; overflow-wrap: anywhere; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 12px; }
    .tag { color: var(--green); font-size: 12px; font-weight: 800; }
    .tag.vote { color: var(--accent); }
    .tag.done { color: var(--muted); }
    .timerow { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; padding: 10px; background: var(--panel2); border-radius: 9px; }
    .timer { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .timer.warn { color: var(--orange); }
    .cardactions { margin-top: 14px; }
    .cardactions button { flex: 1; }
    .empty { grid-column: 1 / -1; padding: 45px 15px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
    .overlay { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: 16px; background: #0009; }
    .overlay.show { display: flex; }
    .modal { width: min(540px, 100%); max-height: 90vh; overflow: auto; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
    .modal h2 { margin-bottom: 8px; }
    .field { display: grid; gap: 6px; margin: 13px 0; }
    .field label { font-size: 13px; font-weight: 750; }
    .icon-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .icon-opt { width: 40px; padding: 5px; background: var(--panel2); border: 1px solid var(--line); }
    .icon-opt.selected { border-color: var(--accent); }
    .resultrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .resulttext { flex: 1; overflow-wrap: anywhere; }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 8; display: none; max-width: min(420px, calc(100% - 36px)); padding: 11px 15px; color: #fff; background: #28252f; border-radius: 10px; box-shadow: 0 4px 20px #0004; }
    .toast.show { display: block; }
    [hidden] { display: none !important; }
    @media (max-width: 680px) {
      .shell { padding-inline: 12px; }
      .grid { grid-template-columns: 1fr; }
      .chatpanel { min-height: 60vh; padding: 12px; }
      .topactions button { padding: 7px 9px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="brand">三角コーナーwebチャット</div>
        <div class="status" id="connectionStatus" role="status">接続を準備しています...</div>
      </div>
      <div class="topactions">
        <button class="secondary" id="profileBtn" type="button">プロフィール</button>
        <button class="secondary" id="historyBtn" type="button" hidden>結果・履歴</button>
        <button id="createBtn" type="button" hidden>＋ お題を作成</button>
      </div>
    </header>
    <nav class="mainnav" aria-label="メインメニュー">
      <button class="navtab active" type="button" data-view="chat">食べカス掲示板</button>
      <button class="navtab" type="button" data-view="ogiri">大喜利</button>
    </nav>
    <section id="chatView">
      <div class="hero">
        <div><h1>食べカス掲示板</h1><p class="sub">匿名チャット。プロフィールを設定して参加できます。</p></div>
        <button class="secondary" id="roomInviteBtn" type="button">共有</button>
      </div>
      <section class="chatpanel">
        <div class="roomheading"><div><h2>フリー掲示板</h2><div class="count" id="roomMeta"></div></div></div>
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="replyingTo" class="replyingto" hidden></div>
        <form id="messageForm" class="messageform">
          <input id="messageInput" maxlength="1000" placeholder="メッセージを入力" autocomplete="off" required>
          <button type="submit">送信</button>
        </form>
      </section>
    </section>
    <section id="ogiriView" hidden>
      <div class="hero"><h1>大喜利</h1></div>
      <div class="toolbar">
        <div class="filters" id="filters">
          <button class="filter active" type="button" data-filter="active">進行中</button>
          <button class="filter" type="button" data-filter="answer">回答受付</button>
          <button class="filter" type="button" data-filter="vote">投票中</button>
          <button class="filter" type="button" data-filter="done">終了済み</button>
          <button class="filter" type="button" data-filter="all">すべて</button>
        </div>
        <div class="count" id="count"></div>
      </div>
      <main class="grid" id="grid"></main>
    </section>
  </div>
  <div class="overlay" id="overlay" role="presentation">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module">
    const STORAGE_KEY = 'sankaku-corner-state-v1';
    const PROFILE_KEY = 'sankaku-corner-profile-v1';
    const MAX_MESSAGES = 100;
    const ICONS = ['🐻','🐱','🐰','🦊','🐶','🐼','🐨','🐯','🦁','🐸','🐵','🐷','🐧','🐦','🦄','🤖','👻','🎃','🌟','🔥','💧','🌈','🎨','🎮','🎵','📚','🍜','🍙'];
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const makeId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
    const initialState = { messages: [], topics: [] };
    let toastTimer;
    let state = initialState;
    let profile = loadProfile();
    try {
      saveProfile();
    } catch (error) {
      console.error('初期プロフィールを保存できませんでした:', error);
    }
    let currentView = location.hash === '#ogiri' ? 'ogiri' : 'chat';
    let filter = 'active';
    let replyTo = null;
    let cloud = null;
    let advancing = false;
    let pendingAdvances = new Map();

    function toast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3500);
    }

    function loadProfile() {
      try {
        const saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
        const now = Date.now();
        const idExpired = !saved.idTime || now - Number(saved.idTime) >= 3600000;
        return {
          uid: saved.uid || makeId(),
          nick: typeof saved.nick === 'string' ? saved.nick.slice(0, 12) : '匿名',
          icon: typeof saved.icon === 'string' ? saved.icon.slice(0, 4) : ICONS[0],
          displayId: idExpired ? makeId().slice(-4).toUpperCase() : saved.displayId || makeId().slice(-4).toUpperCase(),
          idTime: idExpired ? now : Number(saved.idTime)
        };
      } catch (error) {
        console.error('プロフィールの読み込みに失敗しました:', error);
        toast('プロフィールを読み込めません。ブラウザーの保存領域を確認してください。');
        return { uid: makeId(), nick: '匿名', icon: ICONS[0], displayId: makeId().slice(-4).toUpperCase(), idTime: Date.now() };
      }
    }

    function saveProfile() {
      try {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      } catch (error) {
        console.error('プロフィールの保存に失敗しました:', error);
        toast('プロフィールを保存できませんでした。');
        throw error;
      }
    }

    function loadLocalState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return {
          messages: Array.isArray(saved.messages) ? saved.messages : [],
          topics: Array.isArray(saved.topics) ? saved.topics : []
        };
      } catch (error) {
        console.error('ローカルデータの読み込みに失敗しました:', error);
        toast('保存データを読み込めません。新しいデータで開始します。');
        return { ...initialState };
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.error('ローカルデータの保存に失敗しました:', error);
        toast('データを保存できませんでした。ブラウザーの保存領域を確認してください。');
        throw error;
      }
    }

    function render() {
      renderChat();
      renderTopics();
      document.querySelectorAll('.navtab').forEach(button => button.classList.toggle('active', button.dataset.view === currentView));
      $('chatView').hidden = currentView !== 'chat';
      $('ogiriView').hidden = currentView !== 'ogiri';
      $('createBtn').hidden = currentView !== 'ogiri';
      $('historyBtn').hidden = currentView !== 'ogiri';
    }

    function renderChat() {
      const messages = [...state.messages].sort((a, b) => (a.at || 0) - (b.at || 0)).slice(-MAX_MESSAGES);
      $('roomMeta').textContent = `${messages.length} / ${MAX_MESSAGES}件`;
      $('messages').innerHTML = messages.map(message => {
        const parent = messages.find(item => item.id === message.replyTo);
        const liked = (message.likedBy || []).includes(profile.uid);
        const date = new Date(message.at || 0);
        const time = Number.isNaN(date.getTime()) ? '' : date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        return `<article class="message ${message.authorUid === profile.uid ? 'mine' : ''}" data-message-id="${esc(message.id)}">
          ${parent ? `<div class="replypreview">↳ ${esc(parent.name || '匿名')}: ${esc(parent.text)}</div>` : ''}
          <div class="messagehead">${esc(message.icon || '👤')} ${esc(message.name || '匿名')} #${esc(message.displayId || '')} · ${time}</div>
          <div class="messagebody">${esc(message.text)}</div>
          <div class="messagefoot"><button class="likebtn ${liked ? 'liked' : ''}" type="button" data-action="like" data-id="${esc(message.id)}">❤️ ${(message.likedBy || []).length}</button>
          <button class="replybtn" type="button" data-action="reply" data-id="${esc(message.id)}">返信</button></div>
        </article>`;
      }).join('') || '<div class="empty">まだメッセージはありません。</div>';
      $('messages').scrollTop = $('messages').scrollHeight;
    }

    function remaining(topic) {
      const deadline = topic.status === 'answer' ? topic.answerDeadline : topic.status === 'vote' ? topic.voteDeadline : 0;
      return deadline ? Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) : 0;
    }

    function formatTime(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor(seconds % 3600 / 60);
      const secs = seconds % 60;
      return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}` : `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function statusName(status) {
      return ({ ready: '開始待ち', answer: '回答受付中', vote: '投票中', done: '終了', cancelled: '取り下げ' })[status] || '不明';
    }

    function visibleTopics() {
      const order = { answer: 0, vote: 1, ready: 2, done: 3, cancelled: 4 };
      let topics = [...state.topics].sort((a, b) => (order[a.status] ?? 5) - (order[b.status] ?? 5) || (b.createdAt || 0) - (a.createdAt || 0));
      if (filter === 'active') topics = topics.filter(topic => ['ready', 'answer', 'vote'].includes(topic.status));
      else if (filter !== 'all') topics = topics.filter(topic => topic.status === filter);
      return topics;
    }

    function renderTopics() {
      const topics = visibleTopics();
      $('count').textContent = `${topics.length}件のお題`;
      document.querySelectorAll('.filter').forEach(button => button.classList.toggle('active', button.dataset.filter === filter));
      $('grid').innerHTML = topics.map(topic => {
        const isOwner = topic.createdBy === profile.uid;
        const active = ['answer', 'vote'].includes(topic.status);
        const left = remaining(topic);
        const action = topic.status === 'answer' ? '<button type="button" data-action="answer">回答する</button>'
          : topic.status === 'vote' ? '<button type="button" data-action="vote">投票する</button>'
          : topic.status === 'ready' && isOwner ? '<button type="button" data-action="start">開始する</button>'
          : topic.status === 'done' ? '<button class="secondary" type="button" data-action="results">結果を見る</button>' : '';
        return `<article class="card" data-topic-id="${esc(topic.id)}">
          <div class="cardhead"><span class="muted">お題 #${esc(topic.id.slice(0, 5).toUpperCase())}</span><span class="tag ${topic.status === 'vote' ? 'vote' : ['done', 'cancelled'].includes(topic.status) ? 'done' : ''}">${statusName(topic.status)}</span></div>
          <div class="prompt">${esc(topic.prompt)}</div>
          <div class="stats"><span>✍️ 回答 ${(topic.answers || []).length}件</span><span>🗳️ 投票 ${topic.status === 'done' ? `${(topic.votes || []).length}票` : '受付中'}</span><span>◷ ${topic.answerMinutes}分回答 / ${topic.voteMinutes}分投票</span></div>
          ${active ? `<div class="timerow"><span>${topic.status === 'answer' ? '回答締切まで' : '投票締切まで'}</span><span class="timer ${left < 60 ? 'warn' : ''}" data-timer="${esc(topic.id)}">${formatTime(left)}</span></div>` : `<div class="notice">${topic.status === 'ready' ? '開始待ちです。作成者が開始できます。' : statusName(topic.status)}</div>`}
          <div class="cardactions">${action}<button class="secondary" type="button" data-action="details">詳細</button></div>
        </article>`;
      }).join('') || '<div class="empty">この条件のお題はありません。</div>';
    }

    function openModal(content) {
      $('modal').innerHTML = content;
      $('overlay').classList.add('show');
      $('modal').querySelector('input, textarea, button')?.focus();
    }

    function closeModal() {
      $('overlay').classList.remove('show');
    }

    function openProfile() {
      const iconButtons = ICONS.map(icon => `<button type="button" class="icon-opt ${icon === profile.icon ? 'selected' : ''}" data-icon="${icon}" aria-label="${icon}">${icon}</button>`).join('');
      openModal(`<h2 id="modalTitle">プロフィール設定</h2>
        <form id="profileForm">
          <div class="field"><label for="nickInput">名前</label><input id="nickInput" maxlength="12" value="${esc(profile.nick)}" placeholder="匿名"></div>
          <div class="field"><label>アイコン</label><div class="icon-grid">${iconButtons}</div><input id="customIcon" maxlength="4" value="${esc(profile.icon)}" aria-label="カスタムアイコン"></div>
          <p class="muted">匿名ID: #${esc(profile.displayId)}</p>
          <div class="modalactions"><button class="secondary" type="button" data-action="close">キャンセル</button><button type="submit">保存</button></div>
        </form>`);
      $('modal').querySelectorAll('[data-icon]').forEach(button => button.addEventListener('click', () => {
        $('customIcon').value = button.dataset.icon;
        $('modal').querySelectorAll('[data-icon]').forEach(item => item.classList.toggle('selected', item === button));
      }));
      $('profileForm').addEventListener('submit', event => {
        event.preventDefault();
        profile.nick = $('nickInput').value.trim().slice(0, 12) || '匿名';
        profile.icon = $('customIcon').value.trim().slice(0, 4) || ICONS[0];
        try {
          saveProfile();
          closeModal();
          render();
          toast('プロフィールを保存しました');
        } catch (error) {
          console.error('プロフィールを保存できませんでした:', error);
        }
      });
    }

    async function createMessage(text) {
      const message = {
        id: makeId(), text, authorUid: profile.uid, displayId: profile.displayId,
        name: profile.nick, icon: profile.icon, at: Date.now(), replyTo,
        likedBy: []
      };
      if (cloud) {
        await cloud.setDoc(cloud.doc(cloud.db, ...cloud.chatPath, message.id), message);
        replyTo = null;
        $('replyingTo').hidden = true;
        $('replyingTo').textContent = '';
        $('messageInput').value = '';
        const excess = state.messages.length + 1 - MAX_MESSAGES;
        const oldest = [...state.messages].sort((a, b) => a.at - b.at).slice(0, Math.max(0, excess));
        try {
          await Promise.all(oldest.map(item => cloud.deleteDoc(cloud.doc(cloud.db, ...cloud.chatPath, item.id))));
        } catch (error) {
          reportError('古いメッセージを整理できませんでした', error);
        }
      } else {
        state.messages = [...state.messages, message].sort((a, b) => a.at - b.at).slice(-MAX_MESSAGES);
        saveLocalState();
        renderChat();
        replyTo = null;
        $('replyingTo').hidden = true;
        $('replyingTo').textContent = '';
        $('messageInput').value = '';
      }
    }

    async function toggleLike(id) {
      if (cloud) {
        const ref = cloud.doc(cloud.db, ...cloud.chatPath, id);
        await cloud.runTransaction(cloud.db, async transaction => {
          const snapshot = await transaction.get(ref);
          if (!snapshot.exists()) throw new Error('このメッセージは削除されています。');
          const message = snapshot.data();
          const likedBy = message.likedBy || [];
          const next = likedBy.includes(profile.uid) ? likedBy.filter(uid => uid !== profile.uid) : [...likedBy, profile.uid];
          transaction.update(ref, { likedBy: next });
        });
      } else {
        state.messages = state.messages.map(message => {
          if (message.id !== id) return message;
          const likedBy = message.likedBy || [];
          return { ...message, likedBy: likedBy.includes(profile.uid) ? likedBy.filter(uid => uid !== profile.uid) : [...likedBy, profile.uid] };
        });
        saveLocalState();
        renderChat();
      }
    }

    async function createTopic() {
      const presets = [['5分', 5], ['10分', 10], ['30分', 30], ['1時間', 60], ['3時間', 180]];
      const presetButtons = field => presets.map(([label, minutes]) => `<button class="secondary small" type="button" data-preset="${field}" data-minutes="${minutes}">${label}</button>`).join(' ');
      openModal(`<h2 id="modalTitle">お題を作成</h2>
        <form id="topicForm">
          <div class="field"><label for="topicPrompt">お題</label><textarea id="topicPrompt" maxlength="300" required></textarea></div>
          <div class="field"><label for="answerMinutes">回答時間（分）</label><div>${presetButtons('answerMinutes')}</div><input id="answerMinutes" type="number" min="1" max="10080" value="10" required></div>
          <div class="field"><label for="voteMinutes">投票時間（分）</label><div>${presetButtons('voteMinutes')}</div><input id="voteMinutes" type="number" min="1" max="10080" value="5" required></div>
          <label><input id="startNow" type="checkbox" checked style="width:auto"> 作成後すぐに回答受付を開始</label>
          <div class="modalactions"><button class="secondary" type="button" data-action="close">キャンセル</button><button type="submit">作成</button></div>
        </form>`);
      $('modal').querySelectorAll('[data-preset]').forEach(button => button.addEventListener('click', () => {
        $(`${button.dataset.preset}`).value = button.dataset.minutes;
      }));
      $('topicForm').addEventListener('submit', async event => {
        event.preventDefault();
        const prompt = $('topicPrompt').value.trim();
        const answerMinutes = Number($('answerMinutes').value);
        const voteMinutes = Number($('voteMinutes').value);
        if (!prompt) return toast('お題を入力してください');
        if (![answerMinutes, voteMinutes].every(value => Number.isInteger(value) && value >= 1 && value <= 10080)) return toast('時間は1〜10,080分で入力してください');
        const now = Date.now();
        const topic = {
          id: makeId(), prompt, createdBy: profile.uid, createdAt: now,
          status: $('startNow').checked ? 'answer' : 'ready',
          answerMinutes, voteMinutes,
          answerDeadline: $('startNow').checked ? now + answerMinutes * 60000 : null,
          voteDeadline: null, endedAt: null, cancelledAt: null, answers: [], votes: []
        };
        try {
          await writeTopic(topic);
          closeModal();
          toast('お題を作成しました');
        } catch (error) {
          reportError('お題を作成できませんでした', error);
        }
      });
    }

    async function writeTopic(topic) {
      if (cloud) await cloud.setDoc(cloud.doc(cloud.db, ...cloud.topicPath, topic.id), topic);
      else {
        state.topics = [...state.topics, topic];
        saveLocalState();
        renderTopics();
      }
    }

    async function changeTopic(id, update) {
      if (cloud) {
        const ref = cloud.doc(cloud.db, ...cloud.topicPath, id);
        return cloud.runTransaction(cloud.db, async transaction => {
          const snapshot = await transaction.get(ref);
          if (!snapshot.exists()) throw new Error('お題が見つかりません。');
          const changes = update(snapshot.data());
          if (Object.keys(changes).length) transaction.update(ref, changes);
          return changes;
        });
      }
      const topic = state.topics.find(item => item.id === id);
      if (!topic) throw new Error('お題が見つかりません。');
      Object.assign(topic, update(topic));
      saveLocalState();
      renderTopics();
      return topic;
    }

    function showAnswer(id) {
      const topic = state.topics.find(item => item.id === id);
      if (!topic || topic.status !== 'answer') return;
      openModal(`<h2 id="modalTitle">回答する</h2><p>${esc(topic.prompt)}</p>
        <form id="answerForm"><div class="field"><label for="answerText">回答</label><textarea id="answerText" maxlength="500" required></textarea></div>
        <div class="modalactions"><button class="secondary" type="button" data-action="close">キャンセル</button><button type="submit">回答を送信</button></div></form>`);
      $('answerForm').addEventListener('submit', async event => {
        event.preventDefault();
        const text = $('answerText').value.trim();
        if (!text) return toast('回答を入力してください');
        try {
          await changeTopic(id, current => {
            if (current.status !== 'answer' || Date.now() >= current.answerDeadline) throw new Error('回答受付は終了しています。');
            const answers = current.answers || [];
            if (answers.some(answer => answer.authorUid === profile.uid)) throw new Error('このお題には回答済みです。');
            return { answers: [...answers, { id: makeId(), text, authorUid: profile.uid, name: profile.nick, at: Date.now() }] };
          });
          closeModal();
          toast('回答を送信しました');
        } catch (error) {
          reportError('回答を送信できませんでした', error);
        }
      });
    }

    function showVote(id) {
      const topic = state.topics.find(item => item.id === id);
      if (!topic || topic.status !== 'vote') return;
      const answers = topic.answers || [];
      const voted = (topic.votes || []).some(vote => vote.voterUid === profile.uid);
      if (voted) return toast('このお題には投票済みです');
      if (!answers.length) return toast('投票できる回答がありません');
      openModal(`<h2 id="modalTitle">投票する</h2><p>${esc(topic.prompt)}</p>
        <form id="voteForm">${answers.map(answer => `<label class="resultrow"><input type="radio" name="answer" value="${esc(answer.id)}" required style="width:auto"><span class="resulttext">${esc(answer.text)}</span></label>`).join('')}
        <div class="modalactions"><button class="secondary" type="button" data-action="close">キャンセル</button><button type="submit">投票</button></div></form>`);
      $('voteForm').addEventListener('submit', async event => {
        event.preventDefault();
        const answerId = new FormData(event.currentTarget).get('answer');
        if (!answerId) return toast('投票先を選択してください');
        try {
          await changeTopic(id, current => {
            if (current.status !== 'vote' || Date.now() >= current.voteDeadline) throw new Error('投票は終了しています。');
            const votes = current.votes || [];
            if (votes.some(vote => vote.voterUid === profile.uid)) throw new Error('このお題には投票済みです。');
            if (!(current.answers || []).some(answer => answer.id === answerId)) throw new Error('回答が見つかりません。');
            return { votes: [...votes, { answerId, voterUid: profile.uid, at: Date.now() }] };
          });
          closeModal();
          toast('投票しました');
        } catch (error) {
          reportError('投票できませんでした', error);
        }
      });
    }

    async function startTopic(id) {
      try {
        await changeTopic(id, topic => {
          if (topic.status !== 'ready' || topic.createdBy !== profile.uid) throw new Error('作成者のみ開始できます。');
          return { status: 'answer', answerDeadline: Date.now() + topic.answerMinutes * 60000 };
        });
        toast('回答受付を開始しました');
      } catch (error) {
        reportError('お題を開始できませんでした', error);
      }
    }

    async function cancelTopic(id) {
      try {
        await changeTopic(id, topic => {
          if (topic.createdBy !== profile.uid || !['ready', 'answer', 'vote'].includes(topic.status)) throw new Error('作成者のみ取り下げできます。');
          return { status: 'cancelled', cancelledAt: Date.now() };
        });
        closeModal();
        toast('お題を取り下げました');
      } catch (error) {
        reportError('お題を取り下げできませんでした', error);
      }
    }

    function showResults(id) {
      const topic = state.topics.find(item => item.id === id);
      if (!topic) return;
      const votes = topic.votes || [];
      const tally = (topic.answers || []).map(answer => ({ ...answer, count: votes.filter(vote => vote.answerId === answer.id).length }))
        .sort((a, b) => b.count - a.count);
      let rank = 0;
      let previous = -1;
      const rows = tally.map((answer, index) => {
        if (answer.count !== previous) rank = index + 1;
        previous = answer.count;
        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}位`;
        return `<div class="resultrow"><span>${medal}</span><span class="resulttext">${esc(answer.text)}</span><span>${answer.count}票</span></div>`;
      }).join('');
      openModal(`<h2 id="modalTitle">🏆 結果</h2><p>${esc(topic.prompt)}</p>${rows || '<div class="empty">回答がありませんでした。</div>'}
        <div class="stats"><span>回答 ${(topic.answers || []).length}件</span><span>投票 ${votes.length}票</span></div>
        <div class="modalactions"><button type="button" data-action="close">閉じる</button></div>`);
    }

    function showDetails(id) {
      const topic = state.topics.find(item => item.id === id);
      if (!topic) return;
      const canCancel = topic.createdBy === profile.uid && ['ready', 'answer', 'vote'].includes(topic.status);
      openModal(`<h2 id="modalTitle">お題の詳細</h2><p>${statusName(topic.status)} · 回答 ${(topic.answers || []).length}件</p>
        <div class="notice">${esc(topic.prompt)}</div><div class="stats"><span>回答時間 ${topic.answerMinutes}分</span><span>投票時間 ${topic.voteMinutes}分</span></div>
        <div class="modalactions"><button class="secondary" type="button" data-action="close">閉じる</button>${canCancel ? '<button class="danger" type="button" data-action="cancel-topic">取り下げ</button>' : ''}</div>`);
      $('modal').querySelector('[data-action="cancel-topic"]')?.addEventListener('click', () => cancelTopic(id));
    }

    function showHistory() {
      const topics = state.topics.filter(topic => ['done', 'cancelled'].includes(topic.status)).sort((a, b) => (b.endedAt || b.cancelledAt || 0) - (a.endedAt || a.cancelledAt || 0));
      const rows = topics.map(topic => `<div class="resultrow"><span class="resulttext"><strong>${esc(topic.prompt)}</strong><br><small>${statusName(topic.status)} · 回答 ${(topic.answers || []).length}件</small></span>${topic.status === 'done' ? `<button class="secondary small" type="button" data-history-result="${esc(topic.id)}">結果</button>` : ''}</div>`).join('');
      openModal(`<h2 id="modalTitle">結果・履歴</h2>${rows || '<div class="notice">まだ終了したお題はありません。</div>'}<div class="modalactions"><button type="button" data-action="close">閉じる</button></div>`);
      $('modal').querySelectorAll('[data-history-result]').forEach(button => button.addEventListener('click', () => showResults(button.dataset.historyResult)));
    }

    async function advanceTopics() {
      if (advancing) return;
      advancing = true;
      try {
        const now = Date.now();
        for (const topic of state.topics) {
          const expired = (topic.status === 'answer' && now >= topic.answerDeadline) || (topic.status === 'vote' && now >= topic.voteDeadline);
          if (!expired || (pendingAdvances.get(topic.id) || 0) > now) continue;
          pendingAdvances.set(topic.id, now + 30000);
          try {
            await changeTopic(topic.id, current => {
              if (current.status === 'answer' && now >= current.answerDeadline) {
                return current.answers?.length
                  ? { status: 'vote', voteDeadline: now + current.voteMinutes * 60000 }
                  : { status: 'done', endedAt: now };
              }
              if (current.status === 'vote' && now >= current.voteDeadline) return { status: 'done', endedAt: now };
              return {};
            });
          } catch (error) {
            reportError('お題の状態を更新できませんでした', error);
          }
        }
      } finally {
        advancing = false;
      }
    }

    function reportError(message, error) {
      console.error(message, error);
      toast(`${message}: ${error instanceof Error ? error.message : '詳細はコンソールを確認してください'}`);
    }

    function setConnectionStatus(message) {
      $('connectionStatus').textContent = message;
    }

    function updateView(view) {
      currentView = view;
      if (view === 'chat') history.replaceState(null, '', `${location.pathname}${location.search}#chat`);
      else history.replaceState(null, '', `${location.pathname}${location.search}#ogiri`);
      render();
    }

    document.querySelectorAll('.navtab').forEach(button => button.addEventListener('click', () => updateView(button.dataset.view)));
    $('profileBtn').addEventListener('click', openProfile);
    $('createBtn').addEventListener('click', createTopic);
    $('historyBtn').addEventListener('click', showHistory);
    $('filters').addEventListener('click', event => {
      const button = event.target.closest('[data-filter]');
      if (button) {
        filter = button.dataset.filter;
        renderTopics();
      }
    });
    $('messages').addEventListener('click', async event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const message = state.messages.find(item => item.id === button.dataset.id);
      if (button.dataset.action === 'reply' && message) {
        replyTo = message.id;
        $('replyingTo').hidden = false;
        $('replyingTo').innerHTML = `返信先: ${esc(message.name || '匿名')}「${esc((message.text || '').slice(0, 90))}」 <button class="secondary small" type="button" id="cancelReply">解除</button>`;
        $('cancelReply').addEventListener('click', () => {
          replyTo = null;
          $('replyingTo').hidden = true;
          $('replyingTo').textContent = '';
        });
        $('messageInput').focus();
      } else if (button.dataset.action === 'like') {
        try { await toggleLike(button.dataset.id); } catch (error) { reportError('いいねを更新できませんでした', error); }
      }
    });
    $('grid').addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const id = button.closest('[data-topic-id]').dataset.topicId;
      const actions = {
        answer: () => showAnswer(id), vote: () => showVote(id), start: () => startTopic(id),
        results: () => showResults(id), details: () => showDetails(id)
      };
      actions[button.dataset.action]?.();
    });
    $('modal').addEventListener('click', event => {
      if (event.target.closest('[data-action="close"]')) closeModal();
    });
    $('messageForm').addEventListener('submit', async event => {
      event.preventDefault();
      const input = $('messageInput');
      const text = input.value.trim();
      if (!text) return;
      try { await createMessage(text); } catch (error) { reportError('メッセージを送信できませんでした', error); }
    });
    $('roomInviteBtn').addEventListener('click', async () => {
      const url = `${location.origin}${location.pathname}#chat`;
      try {
        await navigator.clipboard.writeText(url);
        toast('共有リンクをコピーしました');
      } catch (error) {
        prompt('共有リンクをコピーしてください', url);
      }
    });
    $('overlay').addEventListener('click', event => {
      if (event.target === $('overlay')) closeModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeModal();
    });
    window.addEventListener('storage', event => {
      if (event.key === STORAGE_KEY && !cloud) {
        state = loadLocalState();
        render();
      }
    });
    setInterval(() => {
      document.querySelectorAll('[data-timer]').forEach(element => {
        const topic = state.topics.find(item => item.id === element.dataset.timer);
        if (!topic) return;
        const left = remaining(topic);
        element.textContent = formatTime(left);
        element.classList.toggle('warn', left < 60);
      });
      void advanceTopics();
    }, 1000);

    state = loadLocalState();
    render();
    setConnectionStatus('ローカル保存（このブラウザー内のみ）');

    try {
      const injectedConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : window.FIREBASE_CONFIG;
      const config = typeof injectedConfig === 'string' ? JSON.parse(injectedConfig) : injectedConfig;
      if (config?.apiKey && config?.projectId && config.apiKey !== 'dummy') {
        const [appSdk, authSdk, dbSdk] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
        ]);
        const app = appSdk.initializeApp(config);
        const auth = authSdk.getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sankaku-corner-web';
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await authSdk.signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await authSdk.signInAnonymously(auth);
        }
        const db = dbSdk.getFirestore(app);
        const chatPath = ['artifacts', appId, 'public', 'data', 'chat_messages'];
        const topicPath = ['artifacts', appId, 'public', 'data', 'ogiri_topics'];
        cloud = { ...dbSdk, db, chatPath, topicPath };
        dbSdk.onSnapshot(dbSdk.collection(db, ...chatPath), snapshot => {
          state.messages = snapshot.docs.map(item => ({ ...item.data(), id: item.id })).sort((a, b) => (a.at || 0) - (b.at || 0)).slice(-MAX_MESSAGES);
          renderChat();
        }, error => reportError('チャットの同期に失敗しました', error));
        dbSdk.onSnapshot(dbSdk.collection(db, ...topicPath), snapshot => {
          state.topics = snapshot.docs.map(item => ({ ...item.data(), id: item.id }));
          renderTopics();
          void advanceTopics();
        }, error => reportError('お題の同期に失敗しました', error));
        setConnectionStatus('Firebaseでリアルタイム同期中');
      }
    } catch (error) {
      cloud = null;
      console.error('Firebaseの初期化に失敗しました。ローカル保存に切り替えます:', error);
      setConnectionStatus('Firebase接続失敗・ローカル保存中（他の端末とは同期されません）');
      toast('Firebaseに接続できません。設定とネットワークを確認してください。');
    }
  </script>
</body>
</html>
